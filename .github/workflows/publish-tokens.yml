name: Publish Tokens to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/tokens/**'
      - '.github/workflows/publish-tokens.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@OugMontiel'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run build --workspace=@OugMontiel/MonyMontyTokens

      - name: Publish package to GitHub Packages
        run: npm publish --workspace=@OugMontiel/MonyMontyTokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
